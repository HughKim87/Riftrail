<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>리프트레일</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#102c2c;color:#f5f0df;font-family:system-ui,sans-serif}body{height:100dvh;display:flex;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow:hidden}#player{height:100%;width:min(100%,calc((100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom))*.5625));position:relative}canvas{display:block;width:100%;height:100%;background:#102c2c;outline:none}#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:24px;background:#102c2c}h1{font-size:28px;letter-spacing:4px;color:#f6c766}progress{width:75%;height:12px;accent-color:#f6c766}#message{font-size:14px;line-height:1.6;max-width:90%;white-space:pre-wrap}</style></head>
<body><main id="player"><canvas id="unity-canvas" width="540" height="960" tabindex="0" aria-label="리프트레일 게임"></canvas><div id="loading"><h1>리프트레일</h1><div id="message">작은 모험을 준비하고 있어요.</div><progress id="progress" value="0" max="1"></progress></div></main>
<script>
const canvas=document.getElementById('unity-canvas');const build='Build';
const config={dataUrl:build+'/{{{ DATA_FILENAME }}}',frameworkUrl:build+'/{{{ FRAMEWORK_FILENAME }}}',codeUrl:build+'/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:'{{{ COMPANY_NAME }}}',productName:'{{{ PRODUCT_NAME }}}',productVersion:'{{{ PRODUCT_VERSION }}}',matchWebGLToCanvasSize:true,devicePixelRatio:Math.min(window.devicePixelRatio||1,2)};
function fail(error){document.getElementById('message').textContent='게임을 불러오지 못했습니다.\n로컬 서버로 접속했는지 확인하고 새로고침해 주세요.';console.error(error);}
const script=document.createElement('script');script.src=build+'/{{{ LOADER_FILENAME }}}';script.onerror=fail;
script.onload=()=>createUnityInstance(canvas,config,value=>document.getElementById('progress').value=value).then(instance=>{window.riftrail=instance;document.getElementById('loading').style.display='none';canvas.focus();}).catch(fail);
document.body.appendChild(script);
</script></body></html>
